version: '3.8'

services:
  hrms-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrms_main_app
    restart: always
    network_mode: "host"
    environment:
      - MONGO_URI=mongodb://127.0.0.1:27017/hrms_db
      - PORT=8008
      - SECRET_KEY=bbhegde_hrms_super_secret_production_key_2025
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./static:/app/static
      - ./instance:/app/instance
